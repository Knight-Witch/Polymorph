[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymorph-media"
version = "0.1.0.dev13"
description = "Simple high-quality animated WebP conversion and framing utility"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
]

[project.scripts]
polymorph = "polymorph.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polymorph = ["assets/*.svg"]
