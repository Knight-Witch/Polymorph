name: Windows Dev Build

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "build/**"
      - "installer/**"
      - "pyproject.toml"
      - "run_polymorph.py"
      - ".github/workflows/windows-dev-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pillow

      - name: Fetch pinned Polymorph UI fonts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src\polymorph\assets\fonts | Out-Null
          $cinzel = "https://raw.githubusercontent.com/google/fonts/45071f07c63e863a539442ef3562b71ab1f147a6/ofl/cinzel/Cinzel%5Bwght%5D.ttf"
          $inter = "https://raw.githubusercontent.com/google/fonts/e1d6480102fed30739fead0faee463101f892c8f/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
          Invoke-WebRequest $cinzel -OutFile src\polymorph\assets\fonts\Cinzel-wght.ttf
          Invoke-WebRequest $inter -OutFile src\polymorph\assets\fonts\Inter-opsz-wght.ttf
          Invoke-WebRequest "https://raw.githubusercontent.com/google/fonts/45071f07c63e863a539442ef3562b71ab1f147a6/ofl/cinzel/OFL.txt" -OutFile src\polymorph\assets\fonts\OFL-Cinzel.txt
          Invoke-WebRequest "https://raw.githubusercontent.com/google/fonts/e1d6480102fed30739fead0faee463101f892c8f/ofl/inter/OFL.txt" -OutFile src\polymorph\assets\fonts\OFL-Inter.txt
          python build\verify_font_assets.py src\polymorph\assets\fonts

      - name: Run unit tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Fetch pinned FFmpeg 9.0.1 Essentials build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.1-essentials_build.7z"
          $expected = "49a73bdf0850092a252ac4641d922f3048d63ed113e196cc65ce1e4f7fb33e85"
          Invoke-WebRequest $url -OutFile ffmpeg.7z
          $actual = (Get-FileHash ffmpeg.7z -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "FFmpeg archive checksum mismatch: $actual" }
          & "C:\Program Files\7-Zip\7z.exe" x ffmpeg.7z -offmpeg-unpacked -y | Out-Null
          $ffmpeg = Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg binaries not found after extraction" }
          Copy-Item $ffmpeg.FullName tools\ffmpeg.exe
          Copy-Item $ffprobe.FullName tools\ffprobe.exe
          .\tools\ffmpeg.exe -version | Select-Object -First 1

      - name: Build gifski 1.32.0
        shell: pwsh
        run: |
          cargo install gifski --version 1.32.0 --locked --root "$PWD\gifski-root"
          Copy-Item gifski-root\bin\gifski.exe tools\gifski.exe
          .\tools\gifski.exe --version

      - name: Verify bundled conversion toolchain
        shell: pwsh
        run: python build\verify_toolchain.py tools build-smoke\sample.webp

      - name: Verify adaptive converter integration
        shell: pwsh
        run: python build\verify_adaptive_converter.py tools build-smoke\adaptive-integration.json

      - name: Upload adaptive integration diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Polymorph-adaptive-integration
          path: build-smoke/adaptive-integration.json
          if-no-files-found: error

      - name: Compare standalone GIF timing reference
        shell: pwsh
        run: python build\compare_gif_reference.py tools build-smoke\gif-reference

      - name: Upload GIF reference diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Polymorph-gif-reference-diagnostic
          path: build-smoke/gif-reference/
          if-no-files-found: error

      - name: Generate development placeholder icon
        shell: pwsh
        run: python build\make_placeholder_icon.py

      - name: Build Polymorph application
        shell: pwsh
        run: pyinstaller --noconfirm --clean build\Polymorph.spec

      - name: Verify packaged Polymorph application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:POLYMORPH_SMOKE_LOG = "$PWD\build-smoke\packaged-app-smoke.txt"
          $sample = "$PWD\build-smoke\sample.webp"
          $proc = Start-Process -FilePath "$PWD\dist\Polymorph\Polymorph.exe" -ArgumentList @("--smoke-test", "`"$sample`"") -Wait -PassThru
          if (Test-Path $env:POLYMORPH_SMOKE_LOG) {
            Get-Content $env:POLYMORPH_SMOKE_LOG
          }
          if ($proc.ExitCode -ne 0) {
            throw "Packaged Polymorph smoke test failed with exit code $($proc.ExitCode)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Polymorph.iss

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer\Output\Polymorph_Setup_*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer was not generated" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii

      - name: Upload unpacked dev application
        uses: actions/upload-artifact@v4
        with:
          name: Polymorph-dev-app
          path: dist/Polymorph/
          if-no-files-found: error

      - name: Upload dev installer
        uses: actions/upload-artifact@v4
        with:
          name: Polymorph-dev-installer
          path: |
            installer/Output/Polymorph_Setup_*.exe
            installer/Output/Polymorph_Setup_*.exe.sha256
          if-no-files-found: error
